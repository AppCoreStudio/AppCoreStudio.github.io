<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0f">
<title>AppCore — Админ-панель</title>

<style>
:root{
  --bg:#07090e;
  --bg2:#0b0e15;
  --card:#10141d;
  --card2:#151a24;
  --card3:#1a202c;
  --line:rgba(255,255,255,.075);
  --line2:rgba(255,255,255,.12);

  --text:#f8f9fc;
  --muted:#8992a4;
  --muted2:#657084;

  --purple:#8b6cff;
  --purple2:#6c4ff0;

  --green:#36d986;
  --greenBg:rgba(54,217,134,.11);

  --blue:#5c9cff;
  --blueBg:rgba(92,156,255,.11);

  --yellow:#ffc857;
  --yellowBg:rgba(255,200,87,.11);

  --red:#ff6672;
  --redBg:rgba(255,102,114,.11);

  --violetBg:rgba(139,108,255,.11);

  --shadow:0 18px 55px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% -10%,rgba(110,76,240,.15),transparent 35%),
    radial-gradient(circle at 100% 0%,rgba(47,126,255,.08),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.985);
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:min(420px,100%);
  padding:30px;
  border:1px solid var(--line2);
  border-radius:28px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),
    var(--card);
  box-shadow:var(--shadow);
}

.logo{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  box-shadow:0 12px 30px rgba(111,78,240,.3);
  font-size:27px;
  margin-bottom:20px;
}

.login-title{
  font-size:26px;
  font-weight:900;
  letter-spacing:-.6px;
}

.login-sub{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-bottom:24px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#aeb6c5;
  font-size:12px;
  font-weight:800;
}

.input{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid var(--line2);
  border-radius:14px;
  background:#0a0d13;
  color:#fff;
  outline:none;
  transition:.2s;
}

.input:focus{
  border-color:rgba(139,108,255,.7);
  box-shadow:0 0 0 4px rgba(139,108,255,.09);
}

.login-error{
  min-height:20px;
  margin-top:12px;
  color:#ff8d97;
  font-size:12px;
}

/* =========================
   APP
========================= */

.app{
  display:none;
}

.container{
  width:min(1240px,calc(100% - 28px));
  margin:0 auto;
  padding:20px 0 60px;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.header-logo{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  box-shadow:0 10px 28px rgba(111,78,240,.24);
  font-size:22px;
}

.header-title{
  font-size:20px;
  font-weight:950;
  letter-spacing:-.4px;
}

.header-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

/* =========================
   BUTTONS
========================= */

.btn{
  min-height:42px;
  padding:0 14px;
  border:1px solid var(--line2);
  border-radius:13px;
  background:var(--card2);
  color:#fff;
  font-size:12px;
  font-weight:850;
  cursor:pointer;
  transition:.18s;
}

.btn:hover{
  border-color:rgba(255,255,255,.18);
  background:var(--card3);
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none!important;
}

.btn-primary{
  background:linear-gradient(135deg,#8062ff,#6849e8);
  border-color:#8062ff;
  box-shadow:0 9px 24px rgba(111,78,240,.2);
}

.btn-green{
  color:#72efab;
  background:var(--greenBg);
  border-color:rgba(54,217,134,.2);
}

.btn-blue{
  color:#8ebaff;
  background:var(--blueBg);
  border-color:rgba(92,156,255,.2);
}

.btn-yellow{
  color:#ffd96d;
  background:var(--yellowBg);
  border-color:rgba(255,200,87,.2);
}

.btn-red{
  color:#ff969f;
  background:var(--redBg);
  border-color:rgba(255,102,114,.2);
}

.btn-purple{
  color:#c1b4ff;
  background:var(--violetBg);
  border-color:rgba(139,108,255,.22);
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:1.35fr 1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

.stat{
  position:relative;
  overflow:hidden;
  min-height:125px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:21px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),
    var(--card);
  box-shadow:0 12px 40px rgba(0,0,0,.16);
}

.stat::after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  right:-50px;
  bottom:-65px;
  border-radius:50%;
  background:currentColor;
  opacity:.055;
}

.stat.earned{
  color:var(--green);
}

.stat.orders{
  color:var(--blue);
}

.stat.average{
  color:var(--yellow);
}

.stat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.stat-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:rgba(255,255,255,.055);
  font-size:17px;
}

.stat-title{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.stat-value{
  margin-top:14px;
  color:#fff;
  font-size:27px;
  font-weight:950;
  letter-spacing:-.7px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  margin-bottom:15px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(16,20,29,.92);
  backdrop-filter:blur(16px);
}

.toolbar-row{
  display:grid;
  grid-template-columns:minmax(220px,1fr) 190px 190px;
  gap:9px;
}

.search{
  width:100%;
  height:45px;
  padding:0 14px;
  border:1px solid var(--line2);
  border-radius:13px;
  background:#0a0d13;
  color:#fff;
  outline:none;
}

.search:focus{
  border-color:rgba(139,108,255,.65);
  box-shadow:0 0 0 4px rgba(139,108,255,.07);
}

.select{
  width:100%;
  height:45px;
  padding:0 11px;
  border:1px solid var(--line2);
  border-radius:13px;
  background:#0a0d13;
  color:#fff;
  outline:none;
}

.selection-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}

.select-all{
  display:flex;
  align-items:center;
  gap:8px;
  color:#b9c0cc;
  font-size:12px;
  font-weight:750;
}

.select-all input{
  width:17px;
  height:17px;
  accent-color:var(--purple);
}

.selection-count{
  color:var(--muted2);
  font-size:11px;
}

.selection-right{
  display:flex;
  align-items:center;
  gap:8px;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:2px;
  margin-bottom:15px;
}

.tab{
  flex:0 0 auto;
  min-height:40px;
  padding:0 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  color:var(--muted);
  font-size:11px;
  font-weight:850;
  cursor:pointer;
}

.tab.active{
  background:var(--violetBg);
  border-color:rgba(139,108,255,.35);
  color:#c5baff;
}

/* =========================
   SECTIONS
========================= */

.section{
  margin-bottom:15px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--card);
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:17px 18px;
  border-bottom:1px solid var(--line);
}

.section-title-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.section-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--purple);
  box-shadow:0 0 14px rgba(139,108,255,.55);
}

.section-title{
  font-size:14px;
  font-weight:950;
}

.section-count{
  color:var(--muted);
  font-size:11px;
}

.orders{
  display:flex;
  flex-direction:column;
}

/* =========================
   ORDER CARD
========================= */

.order{
  padding:16px 18px;
  border-bottom:1px solid var(--line);
  transition:.18s;
}

.order:last-child{
  border-bottom:0;
}

.order:hover{
  background:rgba(255,255,255,.012);
}

.order-main-row{
  display:flex;
  gap:12px;
}

.order-checkbox-wrap{
  padding-top:2px;
}

.order-checkbox{
  width:18px;
  height:18px;
  accent-color:var(--purple);
}

.order-content{
  min-width:0;
  flex:1;
}

.order-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.order-number{
  color:#fff;
  font-size:15px;
  font-weight:950;
  letter-spacing:-.15px;
  word-break:break-word;
}

.order-date{
  margin-top:4px;
  color:var(--muted2);
  font-size:10px;
}

.status{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:0 9px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.status.awaiting{
  color:#ffd96d;
  background:var(--yellowBg);
  border:1px solid rgba(255,200,87,.15);
}

.status.paid{
  color:#8ebaff;
  background:var(--blueBg);
  border:1px solid rgba(92,156,255,.15);
}

.status.completed{
  color:#72efab;
  background:var(--greenBg);
  border:1px solid rgba(54,217,134,.15);
}

.status.cancelled{
  color:#ff969f;
  background:var(--redBg);
  border:1px solid rgba(255,102,114,.15);
}

.status.draft{
  color:#c5b4ff;
  background:var(--violetBg);
  border:1px solid rgba(139,108,255,.16);
}

.order-info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:13px;
}

.info{
  padding:10px;
  border:1px solid rgba(255,255,255,.05);
  border-radius:12px;
  background:#0c1017;
}

.info-label{
  color:var(--muted2);
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.25px;
}

.info-value{
  margin-top:4px;
  color:#e8ebf1;
  font-size:12px;
  font-weight:850;
  word-break:break-word;
}

.apps{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:11px;
}

.app-tag{
  padding:6px 8px;
  border:1px solid rgba(255,255,255,.055);
  border-radius:8px;
  background:#171c25;
  color:#bfc7d4;
  font-size:10px;
  font-weight:700;
}

.order-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:13px;
}

.order-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.order-actions .btn{
  min-height:36px;
  padding:0 11px;
  font-size:10px;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.empty-icon{
  font-size:28px;
  opacity:.5;
  margin-bottom:8px;
}

/* =========================
   MODAL
========================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(7px);
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(440px,100%);
  padding:22px;
  border:1px solid var(--line2);
  border-radius:22px;
  background:#131821;
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.modal-icon{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:var(--violetBg);
  font-size:20px;
  margin-bottom:14px;
}

.modal-title{
  font-size:18px;
  font-weight:950;
}

.modal-text{
  margin-top:8px;
  color:#9ba4b3;
  font-size:12px;
  line-height:1.55;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-actions .btn{
  flex:1;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  z-index:1100;
  transform:translate(-50%,20px);
  min-width:220px;
  max-width:calc(100% - 30px);
  padding:12px 15px;
  border:1px solid var(--line2);
  border-radius:13px;
  background:#171c25;
  color:#fff;
  text-align:center;
  font-size:12px;
  font-weight:800;
  box-shadow:0 15px 45px rgba(0,0,0,.45);
  opacity:0;
  pointer-events:none;
  transition:.22s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stat:first-child{
    grid-column:1/-1;
  }

  .toolbar-row{
    grid-template-columns:1fr 1fr;
  }

  .toolbar-row .search{
    grid-column:1/-1;
  }

  .order-info{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .container{
    width:calc(100% - 14px);
    padding-top:12px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .header-actions{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .header-actions .btn:last-child{
    grid-column:1/-1;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .stat:first-child{
    grid-column:auto;
  }

  .stat{
    min-height:108px;
  }

  .toolbar-row{
    grid-template-columns:1fr;
  }

  .toolbar-row .search{
    grid-column:auto;
  }

  .selection-row{
    align-items:stretch;
    flex-direction:column;
  }

  .selection-right{
    width:100%;
  }

  .selection-right .btn{
    width:100%;
  }

  .order{
    padding:14px 12px;
  }

  .order-head{
    flex-direction:column;
  }

  .order-info{
    grid-template-columns:1fr 1fr;
  }

  .order-bottom{
    align-items:stretch;
    flex-direction:column;
  }

  .order-actions{
    width:100%;
  }

  .order-actions .btn{
    flex:1 1 100%;
  }

  .status{
    align-self:flex-start;
  }

}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

</div>

          <div class="header-sub">

        </div>

      </div>

      <div class="header-actions">

        <button
          id="notificationButton"
          class="btn btn-yellow"
        >
          🔔 Уведомления
        </button>
<div
  style="
    position: relative;
    display: inline-block;
  "
>
  <button

function showToast(message){

    setTimeout(()=>{
      toast.classList.remove("show");

function money(value){

  return Number(value || 0)
    .toLocaleString("ru-RU") + " ₽";
}

function formatDate(date){

  if(!date){
    return "—";
  }

  return new Date(date).toLocaleString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getApps(order){

function getAppName(app){

  if(typeof app === "string"){

  if(app && typeof app === "object"){

      app.name ||
      app.title ||
      app.app_name ||
      "Приложение"

}

/* =========================

function matchesSearch(order){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  if(!query){
    return true;
  }

  const number =
    String(order.order_number || "")
      .toLowerCase();

  const phone =
    String(order.client_phone || "")
      .toLowerCase();

  return (
    number.includes(query) ||
    phone.includes(query)
  );
}

function sortOrders(list){

  const result =
    [...list];

  result.sort((a,b)=>{

    const aTime =
      new Date(
        a.created_at || 0
      ).getTime();

    const bTime =
      new Date(
        b.created_at || 0
      ).getTime();

    if(sortSelect.value === "oldest"){
      return aTime - bTime;
    }

    return bTime - aTime;
  });

  return result;
}

function filterOrders(list){

  return list.filter(order=>{

    if(!matchesSearch(order)){
      return false;
    }

    if(
      currentTab === "active" &&
      !order.is_draft &&
      order.status !== "completed" &&
      order.status !== "cancelled"
    ){

      if(
        statusFilter.value !== "all" &&
        order.status !== statusFilter.value
      ){
        return false;
      }

      return true;
    }

    if(
      currentTab === "completed" &&
      !order.is_draft &&
      order.status === "completed"
    ){
      return true;
    }

    if(
      currentTab === "cancelled" &&
      !order.is_draft &&
      order.status === "cancelled"
    ){
      return true;
    }

    if(
      currentTab === "draft" &&
      order.is_draft
    ){
      return true;
    }

    return false;
  });
}

function render(){

  draftCount.textContent =
    `${allDraft.length} заказов`;

  const visible =
    sortOrders(
      filterOrders(orders)
    );

  if(currentTab === "active"){

    activeOrders.innerHTML =
      visible.length

            renderOrder(order)

          </div>
        `;
  }

  if(currentTab === "completed"){

    completedOrders.innerHTML =
      visible.length
        ? visible.map(order=>
            renderOrder(order)
          ).join("")
        : `
          <div class="empty">
            <div class="empty-icon">✅</div>
            Завершённых заказов нет
          </div>
        `;
  }

  if(currentTab === "cancelled"){

    cancelledOrders.innerHTML =
      visible.length
        ? visible.map(order=>
            renderOrder(order)
          ).join("")
        : `
          <div class="empty">
            <div class="empty-icon">❌</div>
            Отклонённых заказов нет
          </div>
        `;
  }

  if(currentTab === "draft"){

    draftOrders.innerHTML =
      visible.length
        ? visible.map(order=>
            renderOrder(
              order,
              {draft:true}
            )
          ).join("")
        : `
          <div class="empty">
            <div class="empty-icon">🗑️</div>
            Черновики пусты
          </div>
        `;
  }

  document
    .querySelectorAll(".order-checkbox")
    .forEach(box=>{

      box.addEventListener("change",()=>{

        const id =
          box.dataset.id;

        if(box.checked){
          selectedIds.add(id);
        }else{
          selectedIds.delete(id);
        }

        updateSelectionUI();

      });

    });

  updateSelectionUI();
}

function updateSelectionUI(){

  const count =
    selectedIds.size;

  selectionCount.textContent =
    `· Выбрано: ${count}`;

  moveSelectedButton.disabled =
    count === 0;

  const boxes =
    [...document.querySelectorAll(
      ".order-checkbox"
    )];

  if(!boxes.length){

    selectAll.checked=false;
    selectAll.indeterminate=false;

    return;
  }

  const checked =
    boxes.filter(
      box=>box.checked
    ).length;

  selectAll.checked =
    checked === boxes.length;

  selectAll.indeterminate =
    checked > 0 &&
    checked < boxes.length;
}

selectAll.addEventListener(
  "change",
  ()=>{

    const boxes =
      [...document.querySelectorAll(
        ".order-checkbox"
      )];

    boxes.forEach(box=>{

      box.checked =
        selectAll.checked;

      if(selectAll.checked){
        selectedIds.add(
          box.dataset.id
        );
      }else{
        selectedIds.delete(
          box.dataset.id
        );
      }

    });

    updateSelectionUI();

  }
);

async function setOrderStatus(
  id,
  status
){

  const {
    error
  } = await supabaseClient
    .rpc(
      "admin_set_order_status",
      {
        p_order_id:id,
        p_status:status
      }
    );

  if(error){

    console.error(error);

    showToast(
      "Ошибка изменения статуса: " + (error.message || "")
    );

    return;
  }

  showToast(
    "Статус заказа обновлён"
  );

  await loadOrders();
}

async function moveToDraft(id){

  const {
    data,
    error
  } = await supabaseClient
    .rpc(
      "move_order_to_draft",
      {
        p_order_id:id
      }
    );

  if(error){

    console.error(error);

    showToast(
      "Ошибка перемещения в черновики"
    );

    return;
  }

  if(!data){

    showToast(
      "Заказ не найден"
    );

    return;
  }

  selectedIds.delete(id);

  showToast(
    "Заказ перемещён в черновики"
  );

  await loadOrders();
}

async function restoreFromDraft(id){

  const {
    data,
    error
  } = await supabaseClient
    .rpc(
      "restore_order_from_draft",
      {
        p_order_id:id
      }
    );

  if(error){

    console.error(error);

    showToast(
      "Ошибка восстановления"
    );

    return;
  }

  if(!data){

    showToast(
      "Заказ не найден"
    );

    return;
  }

  showToast(
    "Заказ восстановлен"
  );

  await loadOrders();
}

   MULTI SELECT
========================= */

moveSelectedButton.addEventListener(
  "click",
  ()=>{

    const ids =
      [...selectedIds];

    if(!ids.length){
      return;
    }

    openConfirm(
      "Переместить выбранные заказы?",
      `В черновики будет перемещено заказов: ${ids.length}. Данные не будут удалены.`,
      async()=>{

        let success=0;

        for(
          const id of ids
        ){

          const {
            error
          } = await supabaseClient
            .rpc(
              "move_order_to_draft",
              {
                p_order_id:id
              }
            );

          if(!error){
            success++;
          }

        }

        selectedIds.clear();

        showToast(
          `В черновики перемещено: ${success}`
        );

        await loadOrders();

      }
    );

  }
);

/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const {
    data,
    error
  } = await supabaseClient
    .from("orders")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if(error){

    console.error(error);

    showToast(
      "Ошибка загрузки заказов"
    );

    return;
  }

  const newOrders =
    (data || [])
      .filter(order=>
        !knownOrderIds.has(
          order.id
        ) &&
        !order.is_draft
      );

  if(
    knownOrderIds.size > 0 &&
    newOrders.length > 0
  ){

    notifyNewOrders(
      newOrders
    );

  }

  knownOrderIds =
    new Set(
      (data || [])
        .map(order=>order.id)
    );

  orders =
    data || [];

  render();

  await loadStatistics();
}

/* =========================
   REALTIME
========================= */

async function startOrdersRealtime(){

  if(ordersRealtimeChannel){

    await supabaseClient
      .removeChannel(
        ordersRealtimeChannel
      );

    ordersRealtimeChannel = null;
  }

  ordersRealtimeChannel =
    supabaseClient
      .channel("admin-orders")
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"orders"
        },
        async(payload)=>{

          console.log(
            "Order change:",
            payload
          );

          await loadOrders();

          await updateReferralNotificationBadge();
          
        }
      )
      .subscribe(
        status=>{

          console.log(
            "Orders realtime:",
            status
          );

        }
      );
}

async function stopOrdersRealtime(){

  if(!ordersRealtimeChannel){
    return;
  }

  await supabaseClient
    .removeChannel(
      ordersRealtimeChannel
    );

  ordersRealtimeChannel = null;

  console.log(
    "Orders realtime stopped"
  );
}

/* =========================
   STATISTICS
========================= */

async function loadStatistics(){

  const {
    data,
    error
  } = await supabaseClient
    .rpc(
      "get_orders_statistics"
    );

  if(error){

    console.error(error);

    return;
  }

  const row =
    Array.isArray(data)
      ? data[0]
      : data;

  if(!row){
    return;
  }

  earnedValue.textContent =
    money(
      row.earned_total
    );

  completedValue.textContent =
    Number(
      row.completed_orders || 0
    ).toLocaleString(
      "ru-RU"
    );

  averageValue.textContent =
    money(
      row.average_check
    );
}

/* =========================
   NOTIFICATIONS
========================= */

function notifyNewOrders(
  newOrders
){

  if(!notificationsEnabled){
    return;
  }

  if(
    !("Notification" in window)
  ){
    return;
  }

  if(
    Notification.permission !==
    "granted"
  ){
    return;
  }

  newOrders.forEach(
    order=>{

      try{

        new Notification(
          "AppCore — новая заявка",
          {
            body:
              `${order.order_number} · ${money(order.total)}`
          }
        );

      }catch(error){

        console.log(error);

      }

    }
  );
}

notificationButton.addEventListener(
  "click",
  async()=>{

    if(
      !("Notification" in window)
    ){

      showToast(
        "Браузер не поддерживает уведомления"
      );

      return;
    }

    const permission =
      await Notification.requestPermission();

    if(
      permission === "granted"
    ){

      notificationsEnabled=true;

      notificationButton.textContent =
        "🔔 Уведомления включены";

      showToast(
        "Уведомления включены"
      );

    }else{

      showToast(
        "Разрешение на уведомления не получено"
      );

    }

  }
);

/* =========================
   REFRESH
========================= */

refreshButton.addEventListener(
  "click",
  async()=>{

    refreshButton.disabled=true;

    refreshButton.textContent =
      "⏳ Обновление...";

    await loadOrders();

    refreshButton.disabled=false;

    refreshButton.textContent =
      "🔄 Обновить";

    showToast(
      "Данные обновлены"
    );

  }
);

/* =========================
   LOGIN
========================= */
loginButton.addEventListener(
  "click",
  login
);

loginPassword.addEventListener(
  "keydown",
  event=>{

    if(event.key === "Enter"){
      login();
    }

  }
);

async function login(){

  loginError.textContent = "";

  loginButton.disabled=true;

  loginButton.textContent =
    "Вход...";

  const email =
    loginEmail.value.trim();

  const password =
    loginPassword.value;

  const {
    error
  } = await supabaseClient
    .auth
    .signInWithPassword({
      email,
      password
    });

  loginButton.disabled=false;

  loginButton.textContent =
    "Войти в панель";

  if(error){

    console.error(error);

    loginError.textContent =
      "Неверный email или пароль.";

    return;
  }

  await showDashboard();
}

logoutButton.addEventListener(
  "click",
  async()=>{

    await stopOrdersRealtime();

    await supabaseClient
      .auth
      .signOut();

    dashboard.style.display =
      "none";

    loginScreen.style.display =
      "flex";

    orders=[];

    selectedIds.clear();

    knownOrderIds.clear();

  }
);

/* =========================
   SHOW DASHBOARD
========================= */
async function showDashboard(){

  loginScreen.style.display =
    "none";

  dashboard.style.display =
    "block";

  await loadOrders();

  await startOrdersRealtime();
}

async function updateReferralNotificationBadge(){

  const badge =
    document.getElementById(
      "referralNotificationBadge"
    );

  if(!badge) return;

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "get_referral_admin_withdrawals"
        );

    if(error){

      console.error(
        "Ошибка бейджа рефералов:",
        error
      );

      return;
    }

    const pending =
      (data || []).filter(
        row =>
          row.status === "pending"
      ).length;

    if(pending > 0){

      badge.textContent =
        pending > 99
          ? "99+"
          : pending;

      badge.style.display =
        "block";

    }else{

      badge.style.display =
        "none";

    }

  }catch(error){

    console.error(
      "Ошибка бейджа рефералов:",
      error
    );

  }

}

async function init(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();

  if(session){

    await showDashboard();
    await updateReferralNotificationBadge();
  }else{
    
    loginScreen.style.display =
      "flex";

    dashboard.style.display =
      "none";

  }
}
document
  .getElementById("referralAdminButton")
  .addEventListener(
    "click",
    function () {
      window.location.href =
        "/referral-admin/";
    }
  );

init();
</script>
