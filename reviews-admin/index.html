<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090e">
<title>AppCore — Отзывы</title>
<style>
:root{--bg:#07090e;--card:#10141d;--card2:#151a24;--line:rgba(255,255,255,.08);--text:#f8f9fc;--muted:#8992a4;--purple:#8b6cff;--green:#36d986;--red:#ff6672;--yellow:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,rgba(110,76,240,.15),transparent 35%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:18px 0 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.title{font-size:23px;font-weight:950}.sub{color:var(--muted);font-size:12px;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:#fff;font-weight:800;font-size:11px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#8062ff,#6849e8);border-color:#8062ff}.btn.green{color:#72efab;background:rgba(54,217,134,.1)}.btn.red{color:#ff969f;background:rgba(255,102,114,.1)}.btn.yellow{color:#ffd96d;background:rgba(255,200,87,.1)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.stat b{display:block;font-size:24px;margin-top:7px}.stat span{color:var(--muted);font-size:10px;font-weight:800}.toolbar{display:grid;grid-template-columns:1fr 180px 180px;gap:8px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:14px}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#0a0d13;color:#fff;padding:11px;outline:none}.list{display:flex;flex-direction:column;gap:10px}.review{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px}.review.pinned{border-color:rgba(255,200,87,.35)}.top{display:flex;justify-content:space-between;gap:10px}.author{font-weight:900}.date{color:var(--muted);font-size:10px;margin-top:3px}.stars{color:#ffd05a;letter-spacing:1px}.text{margin:12px 0;color:#dfe3eb;line-height:1.55;font-size:13px;white-space:pre-wrap}.meta{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:5px 8px;border-radius:8px;background:#171c25;color:#aeb7c6;font-size:10px}.reply{margin-top:12px;padding:11px 12px;border-left:3px solid var(--purple);background:rgba(139,108,255,.07);border-radius:8px;color:#dcd7ff;font-size:12px;line-height:1.5}.reply b{display:block;margin-bottom:4px}.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.editor{display:none;margin-top:10px;gap:8px}.editor.show{display:grid}.empty{text-align:center;padding:45px;color:var(--muted);border:1px solid var(--line);border-radius:18px}.error{color:#ff969f;margin:10px 0;font-size:12px}.hidden{display:none!important}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar .input{grid-column:1/-1}}@media(max-width:560px){.head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.toolbar .input{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<header class="head">
<div><div class="title">⭐ Отзывы</div><div class="sub">Управление отзывами AppCore</div></div>
<div class="actions"><button class="btn" id="back">← Заказы</button><button class="btn primary" id="refresh">🔄 Обновить</button><button class="btn" id="logout">Выйти</button></div>
</header>
<div class="stats"><div class="stat"><span>ВСЕГО</span><b id="all">0</b></div><div class="stat"><span>ОПУБЛИКОВАНО</span><b id="approved">0</b></div><div class="stat"><span>СКРЫТО</span><b id="hidden">0</b></div><div class="stat"><span>СРЕДНИЙ РЕЙТИНГ</span><b id="avg">0,0</b></div></div>
<div class="toolbar"><input class="input" id="search" placeholder="Поиск по имени или тексту"><select class="select" id="filter"><option value="all">Все отзывы</option><option value="approved">Опубликованные</option><option value="pending">На проверке</option><option value="rejected">Отклонённые</option><option value="hidden">Скрытые</option><option value="pinned">Закреплённые</option></select><select class="select" id="sort"><option value="new">Сначала новые</option><option value="old">Сначала старые</option><option value="rating">По рейтингу</option><option value="likes">По лайкам</option></select></div>
<div id="error" class="error"></div><div id="list" class="list"></div>
</div>
<script src="../supabase-lite.js?v=20261006c"></script>
<script>
const sb=window.supabase.createClient();let rows=[];
const $=id=>document.getElementById(id);
const stars=n=>"★".repeat(Number(n)||0)+"☆".repeat(5-(Number(n)||0));
const date=v=>new Intl.DateTimeFormat("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(v));
function toast(msg){$("error").textContent=msg;setTimeout(()=>{if($("error").textContent===msg)$("error").textContent=""},3500)}
async function rpc(name,args){const r=await sb.rpc(name,args);if(r.error)throw new Error(r.error.message||"Ошибка");return r.data}
async function load(){try{const r=await sb.auth.getSession();if(!r.data.session){location.href="../admin.html";return}rows=await rpc("get_admin_reviews",{});render()}catch(e){console.error(e);toast("Не удалось загрузить отзывы")}}
function render(){const q=$("search").value.trim().toLowerCase(),f=$("filter").value,s=$("sort").value;let list=rows.filter(r=>{const hay=(r.author+" "+r.text).toLowerCase();if(q&&!hay.includes(q))return false;if(f==="hidden"&&!r.is_hidden)return false;if(f==="pinned"&&!r.is_pinned)return false;if(["approved","pending","rejected"].includes(f)&&r.status!==f)return false;return true});list.sort((a,b)=>s==="old"?new Date(a.created_at)-new Date(b.created_at):s==="rating"?b.rating-a.rating:s==="likes"?b.likes-a.likes:Number(b.is_pinned)-Number(a.is_pinned)||new Date(b.created_at)-new Date(a.created_at));$("all").textContent=rows.length;$("approved").textContent=rows.filter(r=>r.status==="approved"&&!r.is_hidden).length;$("hidden").textContent=rows.filter(r=>r.is_hidden).length;const ar=rows.filter(r=>r.status==="approved");$("avg").textContent=ar.length?(ar.reduce((a,r)=>a+Number(r.rating),0)/ar.length).toFixed(1).replace(".",","):"0,0";$("list").replaceChildren(...(list.length?list.map(card):[(()=>{const d=document.createElement("div");d.className="empty";d.textContent="Отзывы не найдены";return d})()]))}
function card(r){const el=document.createElement("article");el.className="review"+(r.is_pinned?" pinned":"");el.innerHTML='<div class="top"><div><div class="author"></div><div class="date"></div></div><div class="stars"></div></div><div class="text"></div><div class="meta"></div><div class="reply"></div><div class="controls"></div><div class="editor"><textarea class="textarea" rows="3" placeholder="Ответ администратора..."></textarea><button class="btn green save">Сохранить ответ</button></div>';el.querySelector(".author").textContent=r.author||"Клиент";el.querySelector(".date").textContent=date(r.created_at);el.querySelector(".stars").textContent=stars(r.rating);el.querySelector(".text").textContent=r.text||"";const meta=el.querySelector(".meta");meta.innerHTML='<span class="tag">Статус: '+r.status+'</span><span class="tag">♥ '+(r.likes||0)+'</span>'+(r.is_pinned?'<span class="tag">📌 Закреплён</span>':"")+(r.is_hidden?'<span class="tag">👁 Скрыт</span>':"");const reply=el.querySelector(".reply");if(r.admin_reply){reply.innerHTML="<b>Ответ AppCore</b>"+r.admin_reply}else reply.classList.add("hidden");const controls=el.querySelector(".controls");const buttons=[];if(r.status!=="approved")buttons.push(["Опубликовать","green",()=>action("admin_set_review_status",{p_review_id:r.id,p_status:"approved"},"Отзыв опубликован")]);if(r.status==="approved")buttons.push(["Скрыть","yellow",()=>action("admin_set_review_hidden",{p_review_id:r.id,p_hidden:true},"Отзыв скрыт")]);if(r.is_hidden)buttons.push(["Показать","green",()=>action("admin_set_review_hidden",{p_review_id:r.id,p_hidden:false},"Отзыв показан")]);buttons.push([r.is_pinned?"Открепить":"📌 Закрепить","",()=>action("admin_set_review_pinned",{p_review_id:r.id,p_pinned:!r.is_pinned},"Готово")]);buttons.push(["💬 Ответить","",()=>el.querySelector(".editor").classList.toggle("show")]);buttons.push(["🗑 Удалить","red",async()=>{if(confirm("Удалить этот отзыв навсегда?"))await action("admin_delete_review",{p_review_id:r.id},"Отзыв удалён")}]);buttons.forEach(([t,c,fn])=>{const b=document.createElement("button");b.className="btn "+c;b.textContent=t;b.onclick=fn;controls.append(b)});el.querySelector(".textarea").value=r.admin_reply||"";el.querySelector(".save").onclick=async()=>{await action("admin_set_review_reply",{p_review_id:r.id,p_reply:el.querySelector(".textarea").value.slice(0,1000)},"Ответ сохранён")};return el}
async function action(name,args,msg){try{await rpc(name,args);await load();toast(msg)}catch(e){console.error(e);toast(e.message||"Ошибка")}}
$("search").oninput=render;$("filter").onchange=render;$("sort").onchange=render;$("refresh").onclick=load;$("back").onclick=()=>location.href="../admin.html";$("logout").onclick=async()=>{await sb.auth.signOut();location.href="../admin.html"};load();
</script>
</body>
</html>
